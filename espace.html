<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mon espace · Roulettes</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--night:#150d2e;--night2:#1f1442;--night3:#2a1b57;--line:#3a2a6e;--cream:#fbf4e6;--muted:#b9acd8;--cyan:#3ddcf0;--pink:#ff4fa8;--yellow:#ffe14d;--green:#3fd17a;--red:#ff6b6b;--display:"Bungee",Impact,sans-serif}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--night);color:var(--cream);font-family:"Space Grotesk",system-ui,sans-serif;line-height:1.5}
a{color:var(--cyan)}
button,input,select,textarea{font:inherit}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--night2);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;color:var(--cream);text-decoration:none;font-family:var(--display);font-size:1.05rem}
.brand img{width:40px;height:40px;border-radius:50%}
.who{display:flex;align-items:center;gap:10px;font-size:.92rem}
.who img{width:30px;height:30px;border-radius:50%}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.4rem,4vw,2.2rem);margin:0 0 6px}
h2{font-family:var(--display);font-weight:400;font-size:1.25rem;margin:0 0 12px;color:var(--yellow)}
h3{margin:0 0 8px;font-size:1.05rem}
.muted{color:var(--muted)}
.btn{cursor:pointer;border-radius:12px;padding:10px 16px;border:1.5px solid var(--line);background:var(--night3);color:var(--cream);font-weight:700}
.btn:hover{border-color:var(--cyan)}
.btn.primary{background:var(--yellow);color:var(--night);border-color:var(--yellow)}
.btn.pink{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.small{padding:6px 10px;font-size:.85rem;border-radius:9px}
.btn.ghost{background:none}
.btn[disabled]{opacity:.5;cursor:default}
.gate{max-width:480px;margin:8vh auto;text-align:center;background:var(--night2);border:1px solid var(--line);border-radius:22px;padding:30px 24px}
.gate img{width:120px;height:120px;border-radius:50%}
.google{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1f1f1f;border:0;border-radius:999px;padding:12px 22px;font-weight:700;cursor:pointer;margin-top:12px}
.demo{background:#3a2a10;border:1px dashed var(--yellow);color:var(--yellow);border-radius:12px;padding:8px 12px;margin-bottom:16px;font-size:.9rem}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0}
.tabs button{cursor:pointer;border-radius:999px;padding:9px 16px;border:1.5px solid var(--line);background:var(--night2);color:var(--cream);font-weight:700}
.tabs button[aria-selected="true"]{background:var(--cyan);color:var(--night);border-color:var(--cyan)}
.tabs .sep{width:1px;background:var(--line);margin:0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--night2);border:1px solid var(--line);border-radius:18px;padding:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--night2);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:1.4rem}
.stat span{color:var(--muted);font-size:.85rem}
.ok{color:var(--green)}.due{color:var(--red)}.warn{color:var(--yellow)}
.rider{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.rider canvas{width:120px;height:140px;background:linear-gradient(#2a1b57,#1f1442);border-radius:14px}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;background:var(--night3);border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end}
.tbl{width:100%;border-collapse:collapse;font-size:.93rem}
.tbl th{text-align:left;color:var(--muted);font-weight:500;font-size:.82rem;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr:hover td{background:rgba(61,220,240,.04)}
.scroll{overflow-x:auto}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tools input[type=search]{flex:1;min-width:180px}
input,select,textarea{background:var(--night);color:var(--cream);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
input[type=checkbox]{width:auto}
textarea{min-height:80px}
label.f{display:block;font-size:.85rem;color:var(--muted);margin-bottom:10px}
label.f>input,label.f>select,label.f>textarea{margin-top:4px;color:var(--cream)}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.swatches{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.swatches button[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px var(--cyan)}
dialog{background:var(--night2);color:var(--cream);border:1px solid var(--line);border-radius:20px;padding:0;width:min(760px,96vw);max-height:92vh}
dialog::backdrop{background:rgba(8,4,20,.75)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--night2);z-index:2}
.db{padding:18px;overflow:auto}
.sub{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--yellow);color:var(--night);font-weight:700;border-radius:12px;padding:10px 16px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast[hidden]{display:none}
.chart{width:100%;height:220px;display:block;background:var(--night);border-radius:14px}
.big{font-family:var(--display);font-weight:400;font-size:2rem}
@media (max-width:640px){.form2{grid-template-columns:1fr}.rider{grid-template-columns:90px 1fr}.rider canvas{width:90px;height:110px}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./"><img src="logo-roulettes.png" alt="">Roulettes</a>
  <div class="who" id="who"></div>
</header>
<main class="wrap" id="main"><p class="muted">Chargement…</p></main>
<dialog id="dlg"><div class="dh"><h2 id="dlg-t" style="margin:0"></h2><button type="button" class="btn small ghost" id="dlg-x">✕ Fermer</button></div><div class="db" id="dlg-b"></div></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script src="firebase-config.js?v=3"></script>
<script src="rl-data.js?v=3"></script>
<script src="rl-rider.js?v=3"></script>
<script>
(function(){
  var main=document.getElementById('main'),who=document.getElementById('who'),dlg=document.getElementById('dlg'),dlgT=document.getElementById('dlg-t'),dlgB=document.getElementById('dlg-b');
  var CREWS=[{name:'AlleyOop',day:1,time:'16h30'},{name:'Benihana',day:1,time:'18h00'},{name:'Caballerial',day:2,time:'16h30'},{name:'Disaster',day:2,time:'18h00'}];
  var DAYS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
  var CATS=[['cotisation','Cotisation'],['adhesion','Adhésion'],['shop','Shop'],['subvention','Subvention / don'],['prof','Prof de skate'],['materiel','Matériel et achats'],['assurance','Assurance'],['site','Site et outils'],['frais','Frais bancaires'],['autre','Autre']];
  var user=null,S={},tab=null,avatars=[];
  var PLANS=[[390,'QF T1 à T4'],[450,'QF T5 à T7'],[490,'QF T8 à T10'],[0,'Adhésion seule']];
  function planName(x){var p=PLANS.filter(function(q){return+q[0]===+x})[0];return p?p[1]+' · '+eur(x):eur(x)}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function fd(iso){if(!iso)return'';var p=iso.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:iso}
  function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
  var eur=RLD.eur;
  function toast(m){var t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){t.hidden=true},2600)}
  function fail(e){console.error(e);toast('Oups : '+(e&&e.message||e))}
  function open(title,html,onReady){dlgT.textContent=title;dlgB.innerHTML=html;if(!dlg.open)dlg.showModal();if(onReady)onReady(dlgB)}
  document.getElementById('dlg-x').onclick=function(){dlg.close()};
  function val(root,sel){var el=root.querySelector(sel);return el?(el.type==='checkbox'?el.checked:el.value.trim()):''}
  function sum(a,f){return a.reduce(function(s,x){return s+(+(f?f(x):x)||0)},0)}
  // keep the public club list in step with the riders (validated riders that have a crew)
  function pub(r){if(!r||r.status==='en attente'||!r.crew)return Promise.resolve();return RLD.set('publicRiders',r.id,RLD.publicOf(r),true).catch(function(e){console.warn(e)})}
  function syncPublic(riders){return RLD.q('publicRiders').then(function(cur){var by={},ops=[];cur.forEach(function(x){by[x.id]=x});
    riders.forEach(function(r){var want=r.status==='en attente'||!r.crew?null:RLD.publicOf(r),have=by[r.id];delete by[r.id];
      if(want&&(!have||JSON.stringify([have.name,have.crew,have.age,have.stance,have.ch])!==JSON.stringify([want.name,want.crew,want.age,want.stance,want.ch])))ops.push({col:'publicRiders',id:r.id,data:want});
      else if(!want&&have)ops.push({col:'publicRiders',id:r.id,op:'del'})});
    Object.keys(by).forEach(function(id){ops.push({col:'publicRiders',id:id,op:'del'})});return ops.length?RLD.batch(ops):null}).catch(function(e){console.warn(e)})}
  function settings(){return RLD.get('settings','app').then(function(s){S=Object.assign({season:'',prices:[390,450,490],adhesion:20,shop:{tshirt:0,board:0},payInfo:'',mailUrl:'',mailKey:'',crews:CREWS,bankStart:{date:'',amount:0}},s||{});if(!user||!user.admin)return S;
    // the mail script key lives in an admin-only document
    return RLD.get('settings','private').then(function(x){S.mailUrl=x&&x.mailUrl||'';S.mailKey=x&&x.mailKey||'';return S},function(){return S})},function(){return S})}

  // ---------- avatars (same drawing as the village)
  function avatar(cv,rider){avatars.push({cv:cv,ch:RLD.charOf(rider)})}
  (function anim(t){avatars=avatars.filter(function(a){return a.cv.isConnected});avatars.forEach(function(a){var c=a.cv,d=Math.min(devicePixelRatio||1,2),w=c.clientWidth,h=c.clientHeight;if(!w)return;if(c.width!==Math.round(w*d)){c.width=Math.round(w*d);c.height=Math.round(h*d)}
    var x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);var k=h/150;x.fillStyle='rgba(0,0,0,.25)';x.beginPath();x.ellipse(w/2,h-12,30*k,6*k,0,0,7);x.fill();RLRider.draw(x,a.ch,w/2,h-14,1.15*k,t/1000,false)});requestAnimationFrame(anim)})(0);

  // ---------- header + gate
  function header(){who.innerHTML=user?((user.photo?'<img src="'+esc(user.photo)+'" alt="">':'')+'<span>'+esc(user.name)+(user.admin?' · <b class="warn">admin</b>':'')+'</span><button class="btn small" id="out">Se déconnecter</button>'):'';
    var o=document.getElementById('out');if(o)o.onclick=function(){RLD.signOut()}}
  function gate(){main.innerHTML='<div class="gate"><img src="logo-roulettes.png" alt=""><h1>Mon espace</h1><p class="muted">Connecte-toi avec ton adresse Gmail pour voir tes riders, leurs fiches et l’état de tes paiements.</p>'+
    (RLD.mode==='demo'?'<p class="demo">Mode démo : données fictives, gardées seulement dans ce navigateur.</p>':'')+
    '<button class="google" id="login"><svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.1 5.5c4.2-3.9 7.2-9.6 7.2-16.9z"/><path fill="#FBBC05" d="M10.5 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.6l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.1-5.5c-2 1.4-4.6 2.2-8.8 2.2-6.3 0-11.6-4.1-13.5-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>Se connecter avec Google</button>'+
    '<p class="muted" style="font-size:.85rem;margin-top:18px">Ton compte est relié à ta famille par l’adresse e-mail donnée à l’inscription.</p></div>';
    document.getElementById('login').onclick=function(){RLD.signIn().catch(fail)}}

  // ---------- data for the signed-in parent
  function mine(){var em=user.email;return Promise.all([RLD.q('families',[['emails','array-contains',em]]),RLD.q('riders',[['emails','array-contains',em]]),RLD.q('payments',[['emails','array-contains',em]]),RLD.q('orders',[['emails','array-contains',em]])])
    .then(function(r){return{fams:r[0],riders:r[1],pays:r[2],orders:r[3]}})}

  // ---------- app shell
  var TABS_M=[['riders','Mes riders'],['pay','Paiements'],['orders','Commandes']],TABS_A=[['crm','Adhérent·es'],['kids','Riders'],['coach','Prof'],['bank','Banque'],['set','Réglages']];
  function shell(){main.innerHTML=(RLD.mode==='demo'?'<p class="demo">Mode démo : données fictives, gardées seulement dans ce navigateur.</p>':'')+'<h1>Salut '+esc((user.name||'').split(' ')[0])+' !</h1><div class="tabs" role="tablist" id="tabs"></div><div id="panel"></div>';
    var tb=document.getElementById('tabs'),list=TABS_M.slice();if(user.admin)list=list.concat([['|']],TABS_A);
    tb.innerHTML=list.map(function(x){return x[0]==='|'?'<span class="sep"></span>':'<button role="tab" data-t="'+x[0]+'" aria-selected="false">'+x[1]+'</button>'}).join('');
    [].forEach.call(tb.querySelectorAll('[data-t]'),function(b){b.onclick=function(){go(b.dataset.t)}});
    go(tab||(user.admin?'crm':'riders'))}
  function go(t){tab=t;[].forEach.call(document.querySelectorAll('#tabs [data-t]'),function(b){b.setAttribute('aria-selected',String(b.dataset.t===t))});
    var p=document.getElementById('panel');p.innerHTML='<p class="muted">Chargement…</p>';
    ({riders:pRiders,pay:pPay,orders:pOrders,crm:pCrm,kids:pKids,coach:pCoach,bank:pBank,set:pSet}[t])(p).catch(fail)}

  // ---------- parent: riders
  function pRiders(p){return mine().then(function(d){
    if(!d.riders.length){p.innerHTML=noFamily();return}
    var cur='';try{cur=localStorage.getItem('rl-rider')||''}catch(e){}
    p.innerHTML='<div class="grid">'+d.riders.map(function(r){var a=RLD.age(r.birthDate);return'<div class="card"><div class="rider"><canvas data-r="'+r.id+'"></canvas><div><h3>'+esc(r.firstName)+' '+esc(r.lastName)+'</h3>'+
      '<p class="muted" style="margin:0 0 8px">'+(a!=null?a+' ans · ':'')+esc(r.stance&&r.stance!=='?'?r.stance:'stance à découvrir')+'</p>'+(r.crew?'<span class="tag">Crew '+esc(r.crew)+'</span>':'')+
      '<div class="row" style="margin-top:12px"><button class="btn small" data-edit="'+r.id+'">Modifier la fiche</button><button class="btn small" data-look="'+r.id+'">Personnaliser</button></div>'+
      '<p style="margin:10px 0 0"><label><input type="radio" name="me" value="'+r.id+'"'+(cur===r.id||!cur&&r===d.riders[0]?' checked':'')+'> Mon perso dans le village</label></p></div></div></div>'}).join('')+'</div>'+
      '<p class="muted" style="margin-top:16px">Les t-shirts et planches achetés au shop s’ajoutent automatiquement à la garde-robe de ton rider.</p>';
    d.riders.forEach(function(r){avatar(p.querySelector('[data-r="'+r.id+'"]'),r)});
    [].forEach.call(p.querySelectorAll('[name=me]'),function(i){i.onchange=function(){try{localStorage.setItem('rl-rider',i.value)}catch(e){}toast('C’est ton perso dans le village !')}});
    [].forEach.call(p.querySelectorAll('[data-edit]'),function(b){b.onclick=function(){riderForm(d.riders.filter(function(r){return r.id===b.dataset.edit})[0],false,function(){go('riders')})}});
    [].forEach.call(p.querySelectorAll('[data-look]'),function(b){b.onclick=function(){lookForm(d.riders.filter(function(r){return r.id===b.dataset.look})[0])}})})}
  function noFamily(){return'<div class="card"><h2>Aucun rider relié à ton compte</h2><p>L’adresse <b>'+esc(user.email)+'</b> n’est pas encore rattachée à une famille du club. Écris-nous et on la relie à ton inscription.</p><p><a class="btn primary" href="mailto:contact@roulettes.club?subject=Mon%20espace%20Roulettes&body=Bonjour%2C%20pouvez-vous%20relier%20mon%20adresse%20'+encodeURIComponent(user.email)+'%20%C3%A0%20mon%20inscription%20%3F">Écrire au club</a></p></div>'}
  function riderForm(r,admin,done,famId,emails){r=r||{};var crews=(S.crews||CREWS);
    open(r.id?'Fiche de '+r.firstName:'Nouveau rider','<form id="rf"><div class="form2">'+
      '<label class="f">Prénom<input name="firstName" required value="'+esc(r.firstName)+'"></label><label class="f">Nom<input name="lastName" value="'+esc(r.lastName)+'"></label>'+
      '<label class="f">Date de naissance<input type="date" name="birthDate" value="'+esc(r.birthDate)+'"></label>'+
      '<label class="f">Stance<select name="stance">'+['?','Regular','Goofy'].map(function(s){return'<option'+(r.stance===s?' selected':'')+' value="'+s+'">'+(s==='?'?'À découvrir':s)+'</option>'}).join('')+'</select></label>'+
      (admin?'<label class="f">Crew<select name="crew"><option value="">—</option>'+crews.map(function(c){return'<option'+(r.crew===c.name?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')+'</select></label>':'<label class="f">Crew<input disabled value="'+esc(r.crew||'—')+'"></label>')+
      '<label class="f">Contact d’urgence<input name="emergency" value="'+esc(r.emergency)+'" placeholder="Nom et téléphone"></label>'+
      (admin?'<label class="f">Formule de ce rider<select name="plan"><option value="">— (formule de la famille)</option>'+PLANS.map(function(x){return'<option value="'+x[0]+'"'+(r.plan!=null&&r.plan!==''&&+r.plan===+x[0]?' selected':'')+'>'+planName(x[0])+'</option>'}).join('')+'</select></label><label class="f">Adhésion de ce rider (€)<input type="number" name="adhesion" value="'+esc(r.adhesion==null?'':r.adhesion)+'"></label>':'')+'</div>'+
      '<label class="f">Infos santé (allergies, traitement…)<textarea name="medical">'+esc(r.medical)+'</textarea></label>'+
      '<label><input type="checkbox" name="imageRights"'+(r.imageRights?' checked':'')+'> J’autorise le club à publier des photos où mon enfant apparaît</label>'+
      '<div class="row end" style="margin-top:16px">'+(admin&&r.id?'<button type="button" class="btn small ghost due" id="rdel">Supprimer</button>':'')+'<button class="btn primary">Enregistrer</button></div></form>',function(b){
      var f=b.querySelector('#rf');f.onsubmit=function(e){e.preventDefault();
        var data={firstName:val(f,'[name=firstName]'),lastName:val(f,'[name=lastName]'),birthDate:val(f,'[name=birthDate]'),stance:val(f,'[name=stance]'),emergency:val(f,'[name=emergency]'),medical:val(f,'[name=medical]'),imageRights:val(f,'[name=imageRights]')};
        if(admin){data.crew=val(f,'[name=crew]');var pl=val(f,'[name=plan]');data.plan=pl===''?null:+pl;var ad=val(f,'[name=adhesion]');data.adhesion=ad===''?null:+ad}
        var pr=r.id?RLD.update('riders',r.id,data).then(function(){return pub(Object.assign({},r,data))}):RLD.add('riders',Object.assign(data,{familyId:famId,emails:emails||[],look:RLD.defaultLook(),owned:[],status:'validée'})).then(function(id){return pub(Object.assign({id:id},data))});
        pr.then(function(){dlg.close();toast('Fiche enregistrée');done&&done()},fail)};
      var del=b.querySelector('#rdel');if(del)del.onclick=function(){if(confirm('Supprimer la fiche de '+r.firstName+' ?'))RLD.del('riders',r.id).then(function(){dlg.close();done&&done()},fail)}})}
  function lookForm(r){var L=Object.assign(RLD.defaultLook(),r.look||{}),owned=r.owned||[];

    p.innerHTML='<div class="stats"><div class="stat"><span>Solde du compte</span><b class="'+(bal<0?'due':'ok')+'">'+eur(bal)+'</b><span>'+(tx[0]?'au '+fd(tx[0].date):'aucune opération')+'</span></div><div class="stat"><span>Entrées de la saison</span><b class="ok">'+eur(sum(inS.filter(function(x){return x.amount>0}),function(x){return x.amount}))+'</b></div><div class="stat"><span>Sorties de la saison</span><b class="due">'+eur(-sum(inS.filter(function(x){return x.amount<0}),function(x){return x.amount}))+'</b></div></div>'+
      '<div class="tools"><label class="btn primary" style="display:inline-block">Importer un relevé CSV<input type="file" id="bf" accept=".csv,text/csv,.txt" hidden></label><button class="btn" id="badd">+ Opération</button><span class="muted" style="font-size:.85rem">Solde de départ : '+eur(start)+(S.bankStart&&S.bankStart.date?' au '+fd(S.bankStart.date):'')+' (dans Réglages)</span></div>'+
      '<div class="grid" style="grid-template-columns:2fr 1fr;margin-bottom:14px"><div class="card"><h3>Évolution du solde</h3><canvas class="chart" id="bc"></canvas></div><div class="card"><h3>Saison par catégorie</h3><table class="tbl">'+CATS.filter(function(c){return byCat[c[0]]}).map(function(c){return'<tr><td>'+c[1]+'</td><td class="num '+(byCat[c[0]]<0?'due':'ok')+'">'+eur(byCat[c[0]])+'</td></tr>'}).join('')+'</table></div></div>'+
      '<div class="card scroll"><table class="tbl"><tr><th>Date</th><th>Libellé</th><th class="num">Montant</th><th>Catégorie</th><th>Rapprochement</th><th></th></tr>'+tx.slice(0,400).map(function(x){
        var link=x.link?'<span class="tag ok">'+(x.link.type==='payment'?'Paiement '+esc((fams.filter(function(f){return f.id===x.link.fid})[0]||{}).name||''):'Prof '+esc((coaches.filter(function(c){return c.id===x.link.cid})[0]||{}).name||''))+'</span>':
          (x.amount>0&&/cotisation|adhesion|shop/.test(x.cat)?'<select data-lf="'+x.id+'" style="width:auto"><option value="">→ Famille…</option>'+fams.map(function(f){return'<option value="'+f.id+'">'+esc(f.name)+'</option>'}).join('')+'</select>':x.amount<0&&x.cat==='prof'&&coaches.length?'<select data-lc="'+x.id+'" style="width:auto"><option value="">→ Prof…</option>'+coaches.map(function(c){return'<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('')+'</select>':'');
        return'<tr><td>'+fd(x.date)+'</td><td>'+esc(x.label)+'</td><td class="num '+(x.amount<0?'due':'ok')+'">'+eur(x.amount)+'</td><td><select data-cat="'+x.id+'" style="width:auto">'+CATS.map(function(c){return'<option value="'+c[0]+'"'+(x.cat===c[0]?' selected':'')+'>'+c[1]+'</option>'}).join('')+'</select></td><td>'+link+'</td><td class="num"><button class="btn small ghost" data-bdel="'+x.id+'" aria-label="Supprimer">✕</button></td></tr>'}).join('')+'</table></div>';
    chart(document.getElementById('bc'),tx.slice().reverse(),start);
    document.getElementById('bf').onchange=function(e){var file=e.target.files[0];if(file)readText(file).then(function(t){importBank(t,tx,fams,coaches)})};
    document.getElementById('badd').onclick=function(){open('Nouvelle opération','<form id="bo"><div class="form2"><label class="f">Date<input type="date" name="date" value="'+today()+'"></label><label class="f">Montant (négatif pour une dépense)<input type="number" step="0.01" name="amount" required></label></div><label class="f">Libellé<input name="label" required></label><label class="f">Catégorie<select name="cat">'+CATS.map(function(c){return'<option value="'+c[0]+'">'+c[1]+'</option>'}).join('')+'</select></label><div class="row end"><button class="btn primary">Ajouter</button></div></form>',function(b){var f=b.querySelector('#bo');f.onsubmit=function(e){e.preventDefault();var d={date:val(f,'[name=date]'),amount:+val(f,'[name=amount]'),label:val(f,'[name=label]'),cat:val(f,'[name=cat]')};d.hash=d.date+'|'+d.label+'|'+d.amount;RLD.add('bank',d).then(function(){dlg.close();go('bank')},fail)}})};
    [].forEach.call(p.querySelectorAll('[data-cat]'),function(s){s.onchange=function(){RLD.update('bank',s.dataset.cat,{cat:s.value}).then(function(){go('bank')},fail)}});
    [].forEach.call(p.querySelectorAll('[data-bdel]'),function(b){b.onclick=function(){if(confirm('Supprimer cette opération ?'))RLD.del('bank',b.dataset.bdel).then(function(){go('bank')},fail)}});
    // link a bank line to a member payment or a coach payment, creating it if needed
    [].forEach.call(p.querySelectorAll('[data-lf]'),function(s){s.onchange=function(){if(!s.value)return;var x=tx.filter(function(t){return t.id===s.dataset.lf})[0],f=fams.filter(function(q){return q.id===s.value})[0];
      RLD.add('payments',{familyId:f.id,emails:f.emails||[],date:x.date,amount:x.amount,kind:x.cat==='adhesion'?'adhesion':x.cat==='shop'?'shop':'cotisation',method:/ch(e|è)que|chq|remise/i.test(x.label)?'chèque':'virement',label:x.label,season:S.season,bankId:x.id}).then(function(pid){return RLD.update('bank',x.id,{link:{type:'payment',fid:f.id,pid:pid}})}).then(function(){toast('Paiement enregistré pour '+f.name);go('bank')},fail)}});
    [].forEach.call(p.querySelectorAll('[data-lc]'),function(s){s.onchange=function(){if(!s.value)return;var x=tx.filter(function(t){return t.id===s.dataset.lc})[0];
      RLD.add('coachPays',{coachId:s.value,date:x.date,amount:-x.amount,label:x.label,bankId:x.id}).then(function(pid){return RLD.update('bank',x.id,{link:{type:'coach',cid:s.value,pid:pid}})}).then(function(){toast('Paiement à la prof enregistré');go('bank')},fail)}})})}
  function importBank(text,existing,fams,coaches){var rows=parseCSV(text),hi=rows.findIndex(function(r){return r.some(function(c){return/date/i.test(c)})});if(hi<0)hi=0;var head=rows[hi]||[],body=rows.slice(hi+1);
    function col(re){return head.findIndex(function(h){return re.test(h)})}
    var m={date:col(/date/i),label:col(/libell|label|description|op[ée]ration|intitul|d[ée]tail/i),amount:col(/montant|amount|valeur/i),debit:col(/d[ée]bit/i),credit:col(/cr[ée]dit/i)};
    if(m.date<0)m.date=0;if(m.label<0)m.label=1;
    function opts(cur){return'<option value="-1">—</option>'+head.map(function(h,i){return'<option value="'+i+'"'+(i===cur?' selected':'')+'>'+esc(h||'colonne '+(i+1))+'</option>'}).join('')}
    open('Importer le relevé','<p class="muted">Vérifie quelles colonnes correspondent : soit une colonne « Montant », soit « Débit » et « Crédit ».</p><div class="form2">'+
      ['date','label','amount','debit','credit'].map(function(k){return'<label class="f">'+{date:'Date',label:'Libellé',amount:'Montant',debit:'Débit',credit:'Crédit'}[k]+'<select data-m="'+k+'">'+opts(m[k])+'</select></label>'}).join('')+'</div><div id="bp"></div>',function(b){
      var have={};existing.forEach(function(x){have[x.hash]=1});var parsed=[];
      function build(){[].forEach.call(b.querySelectorAll('[data-m]'),function(s){m[s.dataset.m]=+s.value});
        parsed=body.map(function(r){var a=m.amount>=0?num(r[m.amount]):NaN;if(isNaN(a)){var d=m.debit>=0?num(r[m.debit]):NaN,c=m.credit>=0?num(r[m.credit]):NaN;a=(isNaN(c)?0:Math.abs(c))-(isNaN(d)?0:Math.abs(d));if(isNaN(d)&&isNaN(c))a=NaN}
          var t={date:isoDate(r[m.date]),label:(r[m.label]||'').replace(/\s+/g,' ').trim(),amount:Math.round(a*100)/100};t.hash=t.date+'|'+t.label+'|'+t.amount;return t}).filter(function(t){return t.date&&!isNaN(t.amount)&&t.amount!==0});
        var fresh=parsed.filter(function(t){return!have[t.hash]});fresh.forEach(function(t){t.cat=guessCat(t,fams,coaches)});
        b.querySelector('#bp').innerHTML='<p><b>'+parsed.length+'</b> opérations lues, <b>'+fresh.length+'</b> nouvelles.</p><div class="scroll" style="max-height:260px;overflow:auto"><table class="tbl">'+fresh.slice(0,60).map(function(t){return'<tr><td>'+fd(t.date)+'</td><td>'+esc(t.label)+'</td><td class="num">'+eur(t.amount)+'</td><td class="muted">'+t.cat+'</td></tr>'}).join('')+'</table></div><div class="row end" style="margin-top:12px"><button class="btn primary" id="bgo"'+(fresh.length?'':' disabled')+'>Importer '+fresh.length+' opération(s)</button></div>';
        var g=b.querySelector('#bgo');g.onclick=function(){g.disabled=true;var ops=fresh.map(function(t){return{col:'bank',data:t}}),chunks=[];while(ops.length)chunks.push(ops.splice(0,400));
          chunks.reduce(function(pr,c){return pr.then(function(){return RLD.batch(c)})},Promise.resolve()).then(function(){dlg.close();toast(fresh.length+' opérations importées');go('bank')},fail)}}
      [].forEach.call(b.querySelectorAll('[data-m]'),function(s){s.onchange=build});build()})}
  function chart(cv,tx,start){var d=Math.min(devicePixelRatio||1,2),w=cv.clientWidth,h=cv.clientHeight;cv.width=w*d;cv.height=h*d;var x=cv.getContext('2d');x.scale(d,d);
    var pts=[],b=start;tx.forEach(function(t){b+=t.amount;pts.push([t.date,b])});if(pts.length<2){x.fillStyle='#b9acd8';x.font='14px Space Grotesk';x.fillText('Importe un relevé pour voir la courbe.',16,30);return}
    var t0=Date.parse(pts[0][0]),t1=Date.parse(pts[pts.length-1][0])||t0+1,lo=Math.min(0,Math.min.apply(null,pts.map(function(p){return p[1]}))),hi=Math.max.apply(null,pts.map(function(p){return p[1]}))||1,pad=36;
    function X(t){return pad+(Date.parse(t)-t0)/Math.max(1,t1-t0)*(w-pad-10)}function Y(v){return h-24-(v-lo)/Math.max(1,hi-lo)*(h-40)}
    x.strokeStyle='#3a2a6e';x.lineWidth=1;x.fillStyle='#b9acd8';x.font='11px Space Grotesk';[lo,(lo+hi)/2,hi].forEach(function(v){x.beginPath();x.moveTo(pad,Y(v));x.lineTo(w-10,Y(v));x.stroke();x.fillText(Math.round(v)+'€',2,Y(v)+4)});
    x.fillText(fd(pts[0][0]),pad,h-6);x.textAlign='right';x.fillText(fd(pts[pts.length-1][0]),w-10,h-6);x.textAlign='left';
    x.strokeStyle='#3ddcf0';x.lineWidth=2.5;x.beginPath();pts.forEach(function(p,i){var px=X(p[0]),py=Y(p[1]);if(i)x.lineTo(px,py);else x.moveTo(px,py)});x.stroke()}

      '<label class="f">Prix d’un t-shirt (€)<input type="number" step="0.01" name="tshirt" value="'+esc(S.shop.tshirt)+'"></label><label class="f">Prix d’une planche (€)<input type="number" step="0.01" name="board" value="'+esc(S.shop.board)+'"></label></div>'+

      '<div class="sub"><h2>Relances par e-mail</h2><p class="muted">Adresse du script Google Apps Script qui envoie depuis contact@roulettes.club, et sa clé secrète (voir le guide d’installation).</p><label class="f">URL du script<input name="mailUrl" value="'+esc(S.mailUrl)+'" placeholder="https://script.google.com/macros/s/…/exec"></label><label class="f">Clé secrète<input name="mailKey" value="'+esc(S.mailKey)+'"></label></div>'+
      '<div class="row end"><button class="btn primary">Enregistrer</button></div></form>'+

      '<form id="af" class="row" style="margin-top:10px"><input type="email" name="email" placeholder="adresse@gmail.com" required style="flex:1"><button class="btn small primary">+ Admin</button></form></div>'+
      (RLD.mode==='demo'?'<p style="margin-top:14px"><button class="btn small" id="reset">Remettre les données de démo à zéro</button></p>':'');
    var f=document.getElementById('sf');f.onsubmit=function(e){e.preventDefault();
      RLD.set('settings','app',{season:val(f,'[name=season]'),adhesion:+val(f,'[name=adhesion]'),prices:[0,1,2].map(function(i){return+val(f,'[name=p'+i+']')}).filter(Boolean),shop:{tshirt:+val(f,'[name=tshirt]'),board:+val(f,'[name=board]')},payInfo:val(f,'[name=payInfo]'),
        bankStart:{amount:+val(f,'[name=bstart]'),date:val(f,'[name=bdate]')},crews:S.crews||CREWS},true).then(function(){return RLD.set('settings','private',{mailUrl:val(f,'[name=mailUrl]'),mailKey:val(f,'[name=mailKey]')},true)}).then(function(){toast('Réglages enregistrés')},fail)};
    var af=document.getElementById('af');af.onsubmit=function(e){e.preventDefault();RLD.set('admins',val(af,'[name=email]').toLowerCase(),{}).then(function(){go('set')},fail)};
    [].forEach.call(p.querySelectorAll('[data-adel]'),function(b){b.onclick=function(){if(confirm('Retirer l’accès admin de '+b.dataset.adel+' ?'))RLD.del('admins',b.dataset.adel).then(function(){go('set')},fail)}});
    var rs=document.getElementById('reset');if(rs)rs.onclick=function(){RLD.resetDemo();location.reload()}})}

  // ---------- start
  if(RLD.mode==='off'){main.innerHTML='<div class="gate"><img src="logo-roulettes.png" alt=""><h1>Mon espace</h1><p class="muted">L’espace adhérent·es arrive très bientôt.</p><p><a class="btn" href="./">Retour au village</a></p></div>';return}
  RLD.onAuth(function(u){user=u;header();if(!u){tab=null;gate();return}settings().then(shell)});
})();
